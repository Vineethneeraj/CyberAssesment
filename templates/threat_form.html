<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Threat Intelligence Data</title>
  <style>body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f5f7fa;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  
  .container {
    background-color: white;
    padding: 30px 40px;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    width: 400px;
  }
  
  h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
  }
  
  form label {
    display: block;
    margin-top: 15px;
    margin-bottom: 5px;
    font-weight: 600;
  }
  
  form input, form select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
  }
  
  form button {
    margin-top: 25px;
    width: 100%;
    padding: 12px;
    background-color: #2c2f36;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }
  
  form button:hover {
    background-color: #1f2229;
  }
  </style>
</head>
<body>
  <div class="container">
    <h2>Add Threat Intelligence Data</h2>
    <form action="/api/add-threat" name="threatForm" method="POST" >
      <label for="ip">IP Address:</label>
      <input type="text" id="ip" name="ip" required>

      <label for="domain">Domain:</label>
      <input type="text" id="domain" name="domain" required>

      <label for="url">URL:</label>
      <input type="url" id="url" name="url" required>

      <label for="fileHash">File Hash:</label>
      <input type="text" id="fileHash" name="fileHash" required>

      <label for="threatLevel">Threat Level:</label>
      <select id="threatLevel" name="threatLevel" required>
        <option value="">Select Threat Level</option>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
      </select>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
